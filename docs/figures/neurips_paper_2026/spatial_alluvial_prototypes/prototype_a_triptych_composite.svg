<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="softShadowA" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#111827" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1400" height="620" fill="#ffffff"/>
  <text x="44" y="48" font-family="serif" font-size="26" fill="#111827">Prototype A: triptych with spatial context, flow, and support prototypes</text>
  <text x="44" y="78" font-family="serif" font-size="16" fill="#4b5563">Uses the existing p256 local-linear gates spatial map and alluvial assets as layout placeholders.</text>

  <rect x="38" y="118" width="470" height="380" rx="4" fill="#ffffff" stroke="#d0d5dd" filter="url(#softShadowA)"/>
  <text x="58" y="150" font-family="serif" font-size="18" fill="#111827">1. Points in state space</text>
  <image href="../fig_support_barcode_map_p256.png" x="58" y="168" width="430" height="181" preserveAspectRatio="xMinYMin meet"/>
  <rect x="58" y="168" width="150" height="150" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="58" y="386" font-family="serif" font-size="13" fill="#4b5563">Show the actual audited points over the basin map.</text>
  <text x="58" y="407" font-family="serif" font-size="13" fill="#4b5563">Color remains post-hoc evaluation color, not training input.</text>

  <line x1="516" y1="300" x2="600" y2="300" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="610" y="118" width="510" height="380" rx="4" fill="#ffffff" stroke="#d0d5dd" filter="url(#softShadowA)"/>
  <text x="630" y="150" font-family="serif" font-size="18" fill="#111827">2. Same points through exact supports</text>
  <image href="../fig_basin_support_family_alluvial_p256_gated_deep_unbold_headers.png" x="630" y="184" width="470" height="218" preserveAspectRatio="xMidYMid meet"/>
  <text x="630" y="432" font-family="serif" font-size="13" fill="#4b5563">Middle column stays the many exact \(S_abs\) masks.</text>
  <text x="630" y="453" font-family="serif" font-size="13" fill="#4b5563">The visual link is now: spatial basin region -> exact support -> family.</text>

  <line x1="1128" y1="300" x2="1190" y2="300" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="1200" y="118" width="160" height="380" rx="4" fill="#ffffff" stroke="#d0d5dd" filter="url(#softShadowA)"/>
  <text x="1220" y="150" font-family="serif" font-size="18" fill="#111827">3. Family object</text>
  <rect x="1220" y="190" width="110" height="40" fill="#1f77b4" opacity="0.92"/>
  <rect x="1220" y="260" width="110" height="40" fill="#d95f02" opacity="0.92"/>
  <rect x="1220" y="330" width="110" height="40" fill="#009e73" opacity="0.92"/>
  <text x="1275" y="215" text-anchor="middle" font-family="serif" font-size="20" fill="#ffffff">F2</text>
  <text x="1275" y="285" text-anchor="middle" font-family="serif" font-size="20" fill="#ffffff">F1</text>
  <text x="1275" y="355" text-anchor="middle" font-family="serif" font-size="20" fill="#ffffff">F0</text>
  <text x="1220" y="421" font-family="serif" font-size="13" fill="#4b5563">Right side can stay</text>
  <text x="1220" y="441" font-family="serif" font-size="13" fill="#4b5563">compact if the spatial</text>
  <text x="1220" y="461" font-family="serif" font-size="13" fill="#4b5563">panel carries context.</text>
</svg>
