  <rect x="513" y="225" width="210" height="64" rx="8" fill="#0072B2" opacity="0.08" stroke="#0072B2"/>
  <text x="532" y="249" class="label" fill="#0072B2">F_abs family for basin 0</text>
  <text x="532" y="271" class="tiny">one prototype barcode</text>
  <line x1="535" y1="282" x2="704" y2="282" class="axis"/>
  <line x1="548" y1="268" x2="548" y2="296" class="ptick-blue"/><line x1="562" y1="268" x2="562" y2="296" class="ptick-blue"/><line x1="585" y1="268" x2="585" y2="296" class="ptick-blue"/><line x1="612" y1="268" x2="612" y2="296" class="ptick-blue"/><line x1="639" y1="268" x2="639" y2="296" class="ptick-blue"/><line x1="673" y1="268" x2="673" y2="296" class="ptick-blue"/><line x1="696" y1="268" x2="696" y2="296" class="ptick-blue"/>

