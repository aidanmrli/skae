      .label { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 700; }
      .box-title { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 700; fill: #111; }
      .box-body { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; fill: #333; }
