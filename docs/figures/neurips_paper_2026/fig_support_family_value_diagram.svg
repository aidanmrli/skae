  <text x="516" y="535" class="tiny">With families: support identity is stable enough to summarize and reuse.</text>

  <!-- Uses -->
  <rect x="842" y="220" width="290" height="75" rx="10" fill="#fff" stroke="#b8b8b8"/>
  <text x="864" y="248" class="box-title">Basin-scale identity</text>
  <text x="864" y="272" class="box-body">A compact learned state key for comparing</text>
  <text x="864" y="291" class="box-body">points without training on basin labels.</text>

  <rect x="842" y="325" width="290" height="75" rx="10" fill="#fff" stroke="#b8b8b8"/>
  <text x="864" y="353" class="box-title">Readable codebook</text>
  <text x="864" y="377" class="box-body">Each family has a prototype active-coordinate</text>
  <text x="864" y="396" class="box-body">barcode that can be inspected and named.</text>

  <rect x="842" y="430" width="290" height="75" rx="10" fill="#fff" stroke="#b8b8b8"/>
  <text x="864" y="458" class="box-title">Stable route key</text>
  <text x="864" y="482" class="box-body">Pool states by family to cache statistics, fit</text>
  <text x="864" y="501" class="box-body">local maps, or select support-conditioned rules.</text>

  <text x="842" y="545" class="small">The support family is not the basin label. It is the learned sparse-support object that is stable enough to use.</text>
</svg>
