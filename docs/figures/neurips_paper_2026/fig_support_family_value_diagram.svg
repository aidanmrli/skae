  <rect width="1200" height="620" fill="#fff"/>
  <text x="42" y="58" class="title">What a support family is good for</text>
  <text x="42" y="91" class="subtitle">Data-backed schematic from p256 LISTA on local-linear gates: 4,656 deep states, 393 exact S_abs masks, 3 F_abs families, 100% family-dominant basin agreement.</text>

  <text x="54" y="143" class="head">1. Exact supports are too granular</text>
  <text x="54" y="170" class="small">Small coefficient changes create many nearby S_abs masks inside the same basin.</text>

  <text x="505" y="143" class="head">2. Families make a stable key</text>
  <text x="505" y="170" class="small">Greedy Jaccard merging collapses nearby masks into one F_abs object.</text>

  <text x="842" y="143" class="head">3. That key has practical uses</text>
  <text x="842" y="170" class="small">It can be named, inspected, cached, and used to choose a local predictor.</text>

  <line x1="433" y1="329" x2="497" y2="329" class="arrow"/>
  <line x1="743" y1="329" x2="821" y2="329" class="arrow"/>

