output_root: "results/lorenz96_highdim_sparse_20260624"
device: "cpu"
bootstrap_resamples: 2000
profile: "lorenz96_D128_noise_sample_efficiency"
notes:
  - "Focused benchmark for a paper-useful high-dimensional noisy forecasting claim."
  - "Uses one generated dataset per seed/noise condition and reuses validation/test trajectories across train-size arms."

lorenz96:
  seeds: [0, 1, 2]
  dimension: 128
  forcing: 8.0
  n_train: 24
  n_val: 8
  n_test: 8
  train_sizes: [4, 12, 24]
  time_points: 140
  observed_fraction: 1.0
  noise_fraction: 0.05
  horizons: [1, 5, 10, 25, 50, 100]
  latent_dims: [64]
  sparsity_coefficients: [0.0, 0.01, 0.1, 1.0, 10.0]
  truncated_dmd_rank: 32
  training:
    epochs: 40
    patience: 8
    train_horizon: 10
    batch_size: 32
    hidden_dim: 128
    num_layers: 2
    decoder_layers: 1
    lr: 0.0003
    weight_decay: 0.000001
    grad_clip: 1.0
