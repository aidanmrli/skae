output_root: "results/lorenz96_sparsity_mechanism_tune_seed0_gpu_20260624"
device: "cuda"
bootstrap_resamples: 2000
profile: "lorenz96_D128_sparsity_mechanism_seed0_gpu"
notes:
  - "Seed-0 validation tuning grid for noisy Lorenz-96 D=128."
  - "All neural rows use overcomplete dz=512 latents, dense K, no K regularization, and training windows of length 20."
  - "Dense baseline uses tanh hidden activations. Sparse MLP uses a ReLU output gate. LISTA rows tune the LISTA threshold alpha."
  - "This staged run is intended to select sparsity levels before launching three-seed confirmation."

lorenz96:
  seeds: [0]
  dimension: 128
  forcing: 8.0
  n_train: 64
  n_val: 16
  n_test: 16
  train_sizes: [64]
  time_points: 160
  observed_fraction: 1.0
  noise_fraction: 0.05
  horizons: [1, 5, 10, 25, 50, 100]
  train_horizons: [20]
  latent_dims: [512]
  truncated_dmd_rank: 32
  training:
    epochs: 2000
    patience: 200
    batch_size: 512
    hidden_dim: 128
    num_layers: 2
    decoder_layers: 1
    lr: 0.0003
    weight_decay: 0.000001
    grad_clip: 1.0
    sparsity_target: "latent_rollout"
  model_variants:
    - label: "dense_mlp_tanh"
      family: "dense_mlp_tanh"
      preset: "generic_no_shrink"
      latent_dim: 512
      sparsity_coefficient: 0.0
      sparsity_target: "latent_rollout"
      encoder_activation: "tanh"
      decoder_activation: "tanh"
      encoder_last_relu: false
      encoder_use_bias: true
      k_structure: "dense"

    - label: "sparse_mlp_relu_l1_0"
      family: "sparse_mlp_relu"
      preset: "generic_sparse"
      latent_dim: 512
      sparsity_coefficient: 0.0
      sparsity_target: "latent_rollout"
      encoder_activation: "relu"
      encoder_last_relu: true
      encoder_use_bias: true
      k_structure: "dense"
