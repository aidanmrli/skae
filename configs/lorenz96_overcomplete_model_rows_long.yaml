output_root: "results/lorenz96_overcomplete_model_rows_long_20260624"
device: "cpu"
bootstrap_resamples: 2000
profile: "lorenz96_D128_overcomplete_model_rows_long"
notes:
  - "Long-budget Lorenz-96 comparison with overcomplete dz=512 latents, equal to 4x the D=128 observed state."
  - "No K regularization or K structural constraint is used in the neural model rows."
  - "Dense MLP baseline uses tanh hidden activations."
  - "Sparse rows use latent sparsity through encoder/output gates and/or rolled latent L1, not an elementwise K penalty."

lorenz96:
  seeds: [0, 1, 2]
  dimension: 128
  forcing: 8.0
  n_train: 64
  n_val: 16
  n_test: 16
  train_sizes: [64]
  time_points: 160
  observed_fraction: 1.0
  noise_fraction: 0.05
  horizons: [1, 5, 10, 25, 50, 100]
  train_horizons: [20]
  latent_dims: [512]
  truncated_dmd_rank: 32
  training:
    epochs: 2000
    patience: 200
    batch_size: 64
    hidden_dim: 128
    num_layers: 2
    decoder_layers: 1
    lr: 0.0003
    weight_decay: 0.000001
    grad_clip: 1.0
    sparsity_target: "latent_rollout"
  model_variants:
    - label: "dense_mlp_kae"
      preset: "generic_no_shrink"
      latent_dim: 512
      sparsity_coefficient: 0.0
      sparsity_target: "latent_rollout"
      encoder_activation: "tanh"
      decoder_activation: "tanh"
      encoder_last_relu: false
      encoder_use_bias: true
      k_structure: "dense"
    - label: "sparse_mlp_l1_0.01"
      preset: "generic_sparse"
      latent_dim: 512
      sparsity_coefficient: 0.01
      sparsity_target: "latent_rollout"
      k_structure: "dense"
    - label: "sparse_mlp_l1_0.1"
      preset: "generic_sparse"
      latent_dim: 512
      sparsity_coefficient: 0.1
      sparsity_target: "latent_rollout"
      k_structure: "dense"
    - label: "lista_relu"
      preset: "lista_parity_generic_sparse"
      latent_dim: 512
      sparsity_coefficient: 0.01
      sparsity_target: "latent_rollout"
      lista_final_op: "relu"
      lista_alpha: 0.1
      lista_num_loops: 5
      use_homogeneous: false
      k_structure: "dense"
    - label: "lista_shrink"
      preset: "lista_parity_generic_sparse"
      latent_dim: 512
      sparsity_coefficient: 0.01
      sparsity_target: "latent_rollout"
      lista_final_op: "shrink"
      lista_alpha: 0.1
      lista_num_loops: 5
      use_homogeneous: false
      k_structure: "dense"
    - label: "lista_sign_split"
      preset: "lista_parity_generic_sparse"
      latent_dim: 512
      sparsity_coefficient: 0.01
      sparsity_target: "latent_rollout"
      lista_final_op: "sign_split"
      lista_alpha: 0.1
      lista_num_loops: 5
      use_homogeneous: false
      k_structure: "dense"
    - label: "hyperlista"
      preset: "hyperlista_parity_generic_sparse"
      latent_dim: 512
      sparsity_coefficient: 0.01
      sparsity_target: "latent_rollout"
      hyperlista_num_loops: 5
      use_homogeneous: false
      k_structure: "dense"
